[build]
  command = "corepack pnpm install --frozen-lockfile && corepack pnpm build:deploy"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Keep dummy-content deployments out of search until content is approved.
  SITE_INDEXING = "false"

[context.deploy-preview.environment]
  SITE_INDEXING = "false"

[context.branch-deploy.environment]
  SITE_INDEXING = "false"

# Development fixtures stay available locally, never on the hosted website.
[[redirects]]
  from = "/dev/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/404"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/404.html"
  [headers.values]
    X-Robots-Tag = "noindex"
